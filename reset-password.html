<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đặt lại mật khẩu Sổ Quỹ</title><style>body{font:16px system-ui;background:#f3f7f5;color:#153d32;max-width:440px;margin:50px auto;padding:16px}main{background:white;padding:25px;border-radius:16px;box-shadow:0 4px 20px #0001}input,button{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc}button{background:#166449;color:white;border:0}small{color:#555}</style></head><body><main><h2>Đặt lại mật khẩu Sổ Quỹ</h2><p id="status">Đang kiểm tra liên kết…</p><div id="form" hidden><label>Mật khẩu mới (ít nhất 8 ký tự)</label><input id="pass" type="password" autocomplete="new-password"><label>Nhập lại mật khẩu</label><input id="again" type="password" autocomplete="new-password"><details><summary>Cấu hình dự án (lần đầu)</summary><label>Publishable/anon key</label><input id="key" type="password" placeholder="sb_publishable_..."><button id="savekey" type="button">Lưu khóa</button></details><button id="submit" type="button">Đặt lại mật khẩu</button></div><small>Chỉ đặt lại mật khẩu từ liên kết email của Supabase. Không nhập mật khẩu ở trang lạ.</small></main><script>
const url='https://kenvtcipazykzshcnhjf.supabase.co';const params=new URLSearchParams(location.hash.slice(1));const token=params.get('access_token');const type=params.get('type');const error=params.get('error_description')||params.get('error');const st=document.getElementById('status');const form=document.getElementById('form');const keyInput=document.getElementById('key');let appKey='';try{appKey=JSON.parse(localStorage.getItem('soquy_cloud_config_v13')||'null')?.key||''}catch{}keyInput.value=localStorage.getItem('soquy_recovery_public_key')||appKey;history.replaceState(null,'',location.pathname);if(token&&type==='recovery'){st.textContent='Liên kết hợp lệ. Nhập mật khẩu mới.';form.hidden=false}else if(type==='signup'||type==='email')st.textContent='Email đã được xác nhận. Hãy mở Sổ Quỹ và đăng nhập.';else st.textContent=error?'Liên kết lỗi hoặc hết hạn: '+error:'Liên kết không hợp lệ hoặc đã hết hạn. Hãy yêu cầu lại từ ứng dụng.';
document.getElementById('savekey').onclick=()=>{const key=keyInput.value.trim();if(!key||key.startsWith('sb_secret_')||key.includes('service_role'))return alert('Chỉ dùng publishable/anon key');localStorage.setItem('soquy_recovery_public_key',key);alert('Đã lưu khóa công khai')};
document.getElementById('submit').onclick=async()=>{const password=document.getElementById('pass').value;const again=document.getElementById('again').value;const key=keyInput.value.trim();if(password.length<8)return alert('Mật khẩu cần ít nhất 8 ký tự');if(password!==again)return alert('Mật khẩu không khớp');if(!key||key.startsWith('sb_secret_')||key.includes('service_role'))return alert('Cần cấu hình publishable/anon key');try{const r=await fetch(url+'/auth/v1/user',{method:'PUT',headers:{apikey:key,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({password})});const d=await r.json();if(!r.ok)throw Error(d.msg||d.message||d.error_description||'Không thể đặt lại mật khẩu');st.textContent='Đã đổi mật khẩu thành công. Hãy mở ứng dụng Sổ Quỹ và đăng nhập bằng mật khẩu mới.';form.hidden=true;document.getElementById('pass').value='';document.getElementById('again').value=''}catch(e){st.textContent='Lỗi: '+e.message}};
</script></body></html>
